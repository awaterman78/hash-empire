<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#070b1c" />
<title>Hash Empire</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050817;color:#eef6ff;font-family:Arial,sans-serif;overscroll-behavior:none}button{font:inherit;color:inherit}.app{min-height:100dvh;max-width:720px;margin:auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(86px + env(safe-area-inset-bottom));background:radial-gradient(circle at 80% 0,#29236b66,transparent 34%),#070b1c}.top{display:flex;justify-content:space-between;align-items:center}.cash small{display:block;color:#8ca0bd;font-size:10px;letter-spacing:.15em}.cash strong{display:block;font-size:28px}.cash span{color:#48e0a4;font-size:13px}.chip{padding:10px 12px;border-radius:14px;background:#141a36;border:1px solid #353e69;color:#c6b5ff}.goal{margin:10px 0;background:#10162dcc;border:1px solid #273253;border-radius:16px;padding:11px}.goal b{font-size:13px}.goal progress{width:100%;height:7px}.world{height:47dvh;min-height:330px;position:relative;border-radius:24px;overflow:hidden;border:1px solid #27335d;box-shadow:0 18px 50px #0008;background:linear-gradient(#080d22,#111735)}canvas{width:100%;height:100%}.token{position:absolute;width:136px;height:136px;border-radius:50%;left:50%;bottom:18px;transform:translateX(-50%);border:3px solid #7ff2ff;background:radial-gradient(circle at 35% 25%,#fff,#6eeaff 15%,#342d8f 55%,#15112d);box-shadow:0 0 22px #67efff,0 16px 24px #0009;touch-action:none;font-size:54px;font-weight:800}.token:active{transform:translateX(-50%) scale(.94)}.combo{text-align:center;margin:8px;color:#a9b8d5}.feed{background:#0e1428;border-radius:12px;padding:9px 12px;color:#8fa4c7;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.actions button,.primary{min-height:54px;border:0;border-radius:14px;background:linear-gradient(135deg,#4ee8ff,#745dff);font-weight:700}.actions button:last-child{background:linear-gradient(135deg,#ffcf68,#d77a2c)}.panel{padding:10px 0}.row{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;background:#10162c;border:1px solid #263251;border-radius:16px;padding:12px;margin:8px 0}.row h3{margin:0 0 4px;font-size:15px}.row p{margin:0;color:#9fb0cb;font-size:12px}.row button{min-width:82px;min-height:48px;border:0;border-radius:12px;background:#1d7f70}.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#1f9ac2,#5431a1);font-weight:700}.locked{opacity:.4}.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.seg button{min-height:44px;border:1px solid #30395e;background:#11172e;border-radius:10px}.seg .on{background:#563bd0}.hero{padding:20px;border-radius:20px;background:linear-gradient(135deg,#152c46,#27194f);border:1px solid #405178}.hero h2{margin-top:0}nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#0a0f22ee;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #26304e}nav button{min-height:58px;border:0;background:none;color:#7484a4;font-size:10px}nav button span{display:block;font-size:20px}nav .active{color:#7deaff;background:#15213b;border-radius:13px}.float{position:fixed;z-index:30;color:#68ffc2;font-weight:800;pointer-events:none;animation:f .8s forwards}@keyframes f{to{transform:translateY(-70px);opacity:0}}.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#02040ddd;padding:20px}.modal>div{width:min(380px,100%);background:#101832;border:1px solid #526086;border-radius:22px;padding:24px;text-align:center}.modal button{width:100%}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(()=>{
const HW=['Refurbished Laptop','Custom Desktop','GPU Workbench','Mining Rack','Liquid Cooled Array','Private Server Room','Modular Data Centre','Renewable Compute Farm','Quantum Processor','Ocean Cooled Facility','Lunar Compute Vault','Orbital Processing Ring','Edge Compute Pod','Photonics Bench','AI Accelerator Cluster','Cryogenic Core','Solar Compute Field','Autonomous Rack Swarm','Neural Fabric Hub','Fusion Powered Campus','Deep Sea Node','Lunar Relay Grid','Mars Data Foundry','Orbital Quantum Mesh'];
const TOK=['Spark','Nova','Pulse','Orbit','Flux','Aether','Prism','Volt','Helix','Quanta','Zenith','Lumen','Echo','Vanta','Nexus','Solaris','Cipher','Nebula','Titan','Singularity'];
const LOC=['Rented Garage','Converted Warehouse','Rooftop Technology Lab','Coastal Innovation Campus','Metropolitan Tower','Alpine Server Vault','Ocean Research City','Lunar Compute Base','Mars Technology Colony','Orbital Processing Ring'];
const KEY='hash-empire-static-v2';
const fresh=()=>({cash:25,life:25,tap:0,token:0,hw:Array(24).fill(0),legacy:0,chips:0,loc:0,last:Date.now()});
let s;try{s={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s=fresh()}
let tab='Empire',qty=1,combo=1,lastTap=0,offline=Math.min((Date.now()-s.last)/1000,14400);s.cash+=income()*offline*.5;s.life+=income()*offline*.5;s.last=Date.now();
const fmt=n=>{if(!isFinite(n))return'∞';if(n<1e6)return n.toLocaleString(undefined,{maximumFractionDigits:1});const u=['M','B','T','Qa','Qi','Sx','Sp','Oc'];let i=Math.min(u.length-1,Math.floor(Math.log10(n)/3)-2);return(n/Math.pow(1000,i+2)).toFixed(2)+u[i]};
function mile(q){return[10,25,50,100,250,500].reduce((m,x)=>q>=x?m*2:m,1)}
function income(){return HW.reduce((a,_,i)=>a+(1.5*Math.pow(7.2,i))*s.hw[i]*mile(s.hw[i]),0)*(1+s.legacy*.1)}
function tapVal(){return Math.pow(4.2,s.token)*(1+s.tap*.65)*combo*(1+s.legacy*.1)}
function tapCost(c=1){return 25*Math.pow(1.55,s.tap)*(Math.pow(1.55,c)-1)/.55}
function unitCost(i,o=s.hw[i]){return 10*Math.pow(8,i)*Math.pow(1.15,o)}
function batch(i,c){return unitCost(i)*(Math.pow(1.15,c)-1)/.15}
function max(i){let c=0,total=0;while(c<500&&total+unitCost(i,s.hw[i]+c)<=s.cash){total+=unitCost(i,s.hw[i]+c);c++}return c}
function save(){s.last=Date.now();localStorage.setItem(KEY,JSON.stringify(s))}
function render(){const app=document.getElementById('app');app.innerHTML=`<main class="app"><div class="top"><div class="cash"><small>CASH</small><strong>£${fmt(s.cash)}</strong><span>+£${fmt(income())}/s</span></div><div class="chip">◈ ${s.chips}</div></div><div class="goal"><b>Level ${s.tap+1}, next world: ${LOC[Math.min(9,s.loc+1)]}</b><progress max="100" value="${Math.min(100,s.cash/Math.pow(1e4,s.loc+1)*100)}"></progress></div>${screen()}<nav>${['Empire','Hardware','Tokens','Influence','Legacy'].map((x,i)=>`<button data-tab="${x}" class="${tab===x?'active':''}"><span>${['⌂','▦','◉','✦','◇'][i]}</span>${x}</button>`).join('')}</nav></main>`;bind();if(tab==='Empire')draw()}
function screen(){if(tab==='Empire')return`<div class="world"><canvas id="world"></canvas><button id="token" class="token">${TOK[s.token][0]}</button></div><div class="combo">Combo x${combo.toFixed(1)} ${combo>7.4?'<b>OVERCLOCK</b>':''}</div><div class="feed">Recent earnings, £${fmt(tapVal())} per tap</div><div class="actions"><button id="upTap">Upgrade Tap<br>£${fmt(tapCost())}</button><button id="expand">Expand World<br>£${fmt(Math.pow(1e4,s.loc+1))}</button></div>`;
if(tab==='Hardware')return`<section class="panel"><div class="seg">${[1,10,25,'MAX'].map(q=>`<button data-qty="${q}" class="${qty==q?'on':''}">${q}</button>`).join('')}</div>${HW.map((h,i)=>{let c=qty==='MAX'?max(i):qty,cost=batch(i,Math.max(1,c)),lock=s.life<Math.pow(7,i)*35;return`<div class="row ${lock?'locked':''}"><div class="icon">${i+1}</div><div><h3>${h}</h3><p>${s.hw[i]} owned, £${fmt(1.5*Math.pow(7.2,i)*s.hw[i])}/s</p></div><button data-buy="${i}" ${lock||c<1||s.cash<cost?'disabled':''}>Buy ${c}<br>£${fmt(cost)}</button></div>`}).join('')}</section>`;
if(tab==='Tokens')return`<section class="panel"><div class="hero"><h2>${TOK[s.token]} Coin</h2><p>Tap value £${fmt(tapVal())}</p><button id="buy10" class="primary">Buy 10 levels, £${fmt(tapCost(10))}</button></div>${TOK.map((t,i)=>`<div class="row ${s.tap<i*5?'locked':''}"><div class="icon">${t[0]}</div><div><h3>${t} Coin</h3><p>Unlocks at tap level ${i*5}</p></div></div>`).join('')}</section>`;
if(tab==='Influence')return`<section class="panel"><div class="hero"><h2>Influence</h2><p>Fund reputation upgrades for a temporary strategic boost.</p></div>${['Launch a podcast','Publish open source software','Sponsor an esports team','Host a technology conference','Build a creator network','Launch a global campaign','Establish a research foundation'].map((x,i)=>`<div class="row"><div class="icon">${i+1}</div><div><h3>${x}</h3><p>Boosts ${i%2?'hardware':'tapping'} by ${5+i*3}%</p></div><button data-influence="1">Fund</button></div>`).join('')}</section>`;
let pts=Math.floor(Math.pow(s.life/1e9,.25));return`<section class="panel"><div class="hero"><h2>Exit and Relaunch</h2><p>Earn ${pts} Legacy Points. Permanent multiplier x${(1+s.legacy*.1).toFixed(1)}</p><button id="prestige" class="primary">Review Exit</button></div><div class="row"><div class="icon">⚙</div><div><h3>Save Controls</h3><p>Export, import or reset your empire.</p></div><button id="reset">Reset</button></div></section>`}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-qty]').forEach(b=>b.onclick=()=>{qty=b.dataset.qty==='MAX'?'MAX':Number(b.dataset.qty);render()});document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let i=+b.dataset.buy,c=qty==='MAX'?max(i):qty,cost=batch(i,c);if(c>0&&s.cash>=cost){s.cash-=cost;s.hw[i]+=c;save();render()}});let t=document.getElementById('token');if(t)t.onpointerdown=e=>{e.preventDefault();let now=Date.now();combo=now-lastTap<450?Math.min(8,combo+.18):Math.max(1,combo);lastTap=now;let v=tapVal();s.cash+=v;s.life+=v;s.token=Math.min(19,Math.floor(s.tap/5));let f=document.createElement('i');f.className='float';f.style.left=e.clientX+'px';f.style.top=e.clientY+'px';f.textContent='+'+fmt(v);document.body.appendChild(f);setTimeout(()=>f.remove(),850);navigator.vibrate?.(8);save();render()};let u=document.getElementById('upTap');if(u)u.onclick=()=>{let c=tapCost();if(s.cash>=c){s.cash-=c;s.tap++;s.token=Math.min(19,Math.floor(s.tap/5));save();render()}};let b=document.getElementById('buy10');if(b)b.onclick=()=>{let c=tapCost(10);if(s.cash>=c){s.cash-=c;s.tap+=10;s.token=Math.min(19,Math.floor(s.tap/5));save();render()}};let ex=document.getElementById('expand');if(ex)ex.onclick=()=>{let c=Math.pow(1e4,s.loc+1);if(s.cash>=c&&s.loc<9){s.cash-=c;s.loc++;save();render()}};document.querySelectorAll('[data-influence]').forEach(b=>b.onclick=()=>{s.cash*=.9;save();render()});let p=document.getElementById('prestige');if(p)p.onclick=()=>{let pts=Math.floor(Math.pow(s.life/1e9,.25));if(pts>0&&confirm(`Reset this run for ${pts} Legacy Points?`)){let keep=s.legacy+pts;s=fresh();s.legacy=keep;save();render()}};let r=document.getElementById('reset');if(r)r.onclick=()=>{if(confirm('Completely reset Hash Empire?')){s=fresh();save();render()}}}
function draw(){let c=document.getElementById('world');if(!c)return,0;let x=c.getContext('2d'),d=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;x.scale(d,d);x.fillStyle='#0a1028';x.fillRect(0,0,w,h);x.strokeStyle='#2c4d70';for(let i=0;i<12;i++){x.beginPath();x.moveTo(w/2,i*30);x.lineTo(i<6?0:w,(i%6)*55+h*.2);x.stroke()}let n=Math.min(18,s.hw.filter(v=>v>0).length+2);for(let i=0;i<n;i++){let px=35+(i%6)*60,py=h*.28+Math.floor(i/6)*48;x.fillStyle=`hsl(${185+(i*17)%100} 80% 45%)`;x.fillRect(px,py-18,42,28);x.fillStyle='#7df2ff';x.fillRect(px+8,py-12,26,4)}x.fillStyle='#dbeaff';x.font='600 13px Arial';x.fillText(LOC[s.loc],16,24)}
setInterval(()=>{let inc=income()/5;s.cash+=inc;s.life+=inc;if(Date.now()-lastTap>3000)combo=Math.max(1,combo-.1);save();if(tab==='Empire')render()},200);render();
})();
</script>
</body>
</html>
